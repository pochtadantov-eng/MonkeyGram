name: Build MonkeyGram IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'cursor/**'
    paths:
      - 'ios/**'
      - '.github/workflows/build-ipa.yml'

permissions:
  contents: write

jobs:
  build-ipa:
    # Latest Telegram-iOS needs Xcode 27.1 (Icon Composer .icon bundles).
    runs-on: xcode-27
    timeout-minutes: 360

    steps:
      - name: Checkout MonkeyGram
        uses: actions/checkout@v4
        with:
          path: monkeygram

      - name: Checkout Telegram-iOS (latest)
        uses: actions/checkout@v4
        with:
          repository: TelegramMessenger/Telegram-iOS
          path: telegram-ios
          submodules: recursive
          fetch-depth: 0

      - name: Show toolchain
        run: |
          set -x
          sw_vers
          xcodebuild -version || true
          ls /Applications | grep -i Xcode || true
          python3 --version

      - name: Apply MonkeyGram patches
        run: |
          set -euo pipefail
          python3 monkeygram/ios/scripts/apply_monkeygram_patches.py \
            --telegram-root telegram-ios \
            --overlay-root monkeygram/ios

      - name: Select Xcode from versions.json
        run: |
          set -euo pipefail
          WANT=$(python3 -c 'import json; print(json.load(open("telegram-ios/versions.json"))["xcode"])')
          echo "versions.json wants Xcode $WANT"
          if [ -d "/Applications/Xcode_${WANT}.app" ]; then
            sudo xcode-select -s "/Applications/Xcode_${WANT}.app/Contents/Developer"
          elif [ -d "/Applications/Xcode_${WANT}.0.app" ]; then
            sudo xcode-select -s "/Applications/Xcode_${WANT}.0.app/Contents/Developer"
          else
            echo "Exact Xcode $WANT not found; listing /Applications:"
            ls /Applications | grep -i Xcode || true
            # xcode-27 image defaults to 27.1 — still prefer override only if missing
            xcode-select -p
          fi
          xcodebuild -version

      - name: Canonical source path
        run: |
          set -euo pipefail
          sudo mkdir -p /Users/Shared
          sudo rm -rf /Users/Shared/telegram-ios
          sudo cp -R "$GITHUB_WORKSPACE/telegram-ios" /Users/Shared/telegram-ios
          sudo chown -R "$(whoami)" /Users/Shared/telegram-ios

      - name: Build unsigned IPA
        run: |
          set -euo pipefail
          SOURCE_DIR=/Users/Shared/telegram-ios
          BAZEL_USER_ROOT="/private/var/tmp/_bazel_monkeygram"
          cd "$SOURCE_DIR"

          APP_VERSION=$(python3 -c 'import json; print(json.load(open("versions.json"))["app"])')
          BUILD_NUMBER_OFFSET="$(cat build_number_offset)"
          COMMIT_COUNT=$(git rev-list --count HEAD)
          BUILD_NUMBER=$((COMMIT_COUNT + BUILD_NUMBER_OFFSET))
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"

          CONFIG="build-system/appstore-configuration.json"
          if [ -f build-system/monkeygram-configuration.json ]; then
            CONFIG="build-system/monkeygram-configuration.json"
          fi

          python3 build-system/Make/ImportCertificates.py --path build-system/fake-codesigning/certs

          EXTRA_FLAGS=()
          WANT=$(python3 -c 'import json; print(json.load(open("versions.json"))["xcode"])')
          ACTIVE=$(xcodebuild -version | awk '/Xcode/{print $2}')
          if [ "$ACTIVE" != "$WANT" ] && [ ! -d "/Applications/Xcode_${WANT}.app" ]; then
            echo "Active Xcode is $ACTIVE, wanted $WANT — enabling --overrideXcodeVersion"
            EXTRA_FLAGS+=(--overrideXcodeVersion)
          fi

          python3 -u build-system/Make/Make.py \
            --bazelUserRoot="$BAZEL_USER_ROOT" \
            "${EXTRA_FLAGS[@]}" \
            build \
            --configurationPath="$CONFIG" \
            --codesigningInformationPath=build-system/fake-codesigning \
            --configuration=release_arm64 \
            --buildNumber="$BUILD_NUMBER" \
            --outputBuildArtifactsPath=build/artifacts

          ls -lah build/artifacts || true
          if [ ! -f build/artifacts/Telegram.ipa ]; then
            echo "IPA not found via Make output; searching bazel-bin..."
            mkdir -p build/artifacts
            find bazel-bin bazel-out -name 'Telegram.ipa' 2>/dev/null | head
            IPA=$(find bazel-bin bazel-out -name 'Telegram.ipa' 2>/dev/null | head -n 1 || true)
            if [ -z "$IPA" ]; then
              echo "Failed to locate Telegram.ipa"
              exit 1
            fi
            cp "$IPA" build/artifacts/Telegram.ipa
          fi
          cp build/artifacts/Telegram.ipa build/artifacts/MonkeyGram.ipa
          ls -lah build/artifacts

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: MonkeyGram-ipa
          path: |
            /Users/Shared/telegram-ios/build/artifacts/MonkeyGram.ipa
            /Users/Shared/telegram-ios/build/artifacts/Telegram.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: monkeygram-ios-${{ env.BUILD_NUMBER }}
          name: MonkeyGram iOS ${{ env.APP_VERSION }} (${{ env.BUILD_NUMBER }})
          body: |
            Unsigned MonkeyGram IPA (Telegram-iOS + visual gifts / Stars / TON).

            Install via AltStore / Sideloadly / TrollStore (unsigned / ad-hoc).
            Visual features: Settings → MonkeyGram.
          files: |
            /Users/Shared/telegram-ios/build/artifacts/MonkeyGram.ipa
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
